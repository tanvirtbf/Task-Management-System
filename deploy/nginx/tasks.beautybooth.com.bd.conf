# nginx vhost for tasks.beautybooth.com.bd
#
# Install (single chained command - nginx -t gates the reload):
#   cd /var/www/html/tasks-beautybooth && git pull \
#     && cp deploy/nginx/tasks.beautybooth.com.bd.conf \
#           /etc/nginx/sites-available/tasks.beautybooth.com.bd \
#     && nginx -t && systemctl reload nginx && echo DONE
#
# ONE server block listening on BOTH 80 and 443, serving identical content, with
# NO http-to-https redirect. That is deliberate, and it is the fix for an outage
# we actually hit:
#
#   certbot's default layout splits the site into a :443 block plus a :80 block
#   that only issues `return 301 https://...`. With Cloudflare's SSL mode set to
#   Flexible, Cloudflare talks to the origin over port 80 — so it received that
#   redirect, sent the browser back to https, came back to port 80 again, and
#   looped until the browser gave up. Commenting the redirect out then left the
#   :80 block with no root and no locations, which answered 404 instead.
#
#   Serving both ports identically removes the dependency entirely: the site is
#   up whether Cloudflare is set to Flexible or Full (strict), and switching
#   between them becomes a pure security decision rather than an availability
#   one. Cloudflare still forces HTTPS for browsers ("Always Use HTTPS"), so
#   nothing is lost by dropping the origin-side redirect.
#
# STILL DO SET Cloudflare to Full (strict): under Flexible, the hop from the
# Cloudflare edge to this server is plain HTTP across the public internet, which
# means passwords and JWTs travel in clear text even though the browser shows a
# padlock. The certificate below is what makes Full (strict) work.
#
# Certificate paths are certbot's. `certbot renew` replaces the files in place
# and reloads nginx, so renewal keeps working with this layout.

server {
    listen 80;
    listen 443 ssl;
    server_name tasks.beautybooth.com.bd;

    ssl_certificate     /etc/letsencrypt/live/tasks.beautybooth.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasks.beautybooth.com.bd/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    # Recover the real client IP from CF-Connecting-IP when the request came
    # from a Cloudflare edge. Without it $remote_addr is a Cloudflare address,
    # every per-IP rate limit in the app becomes one company-wide bucket (one
    # person mistyping a password five times would lock out everyone), and the
    # access log is useless for tracing anything.
    # Generate with: deploy/nginx/cloudflare-realip.sh
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Only the BUILT frontend is served. The repo root sits one level up and
    # holds server/.env, database/schema.sql and .git — none of which may ever
    # be reachable over HTTP.
    root /var/www/html/tasks-beautybooth/client/dist;
    index index.html;

    # Attachment uploads are raw bytes through the API (25 MB policy cap in
    # attachmentPolicy.ts). nginx would otherwise 413 them at its 1 MB default.
    client_max_body_size 32m;

    access_log /var/log/nginx/bbtasks.access.log;
    error_log  /var/log/nginx/bbtasks.error.log;

    # The AI assistant streams SSE. Proxy buffering would hold the whole answer
    # until the stream ends (killing the typing effect and risking a read
    # timeout on long answers), and gzip would break the event framing.
    # Exact-match location, so it takes priority over the /api/v1/ prefix below.
    location = /api/v1/assistant/chat {
        proxy_pass http://127.0.0.1:5501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # §29c Level 1 — the live inbox stream. Same SSE reasoning as the assistant
    # above, but a DIFFERENT lifetime: this connection is meant to stay open for
    # the whole session, not for one answer. The 120s read timeout on the
    # generic /api/v1/ block below would be survivable (the server heartbeats
    # every 30s, and each frame resets the timer), but a heartbeat hiccup would
    # then drop the stream — so give it an hour and let the client's own
    # backoff-reconnect handle real failures.
    #
    # The app also sends `X-Accel-Buffering: no`, which nginx honours; this
    # block makes the behaviour explicit rather than dependent on that header.
    location = /api/v1/stream/inbox {
        proxy_pass http://127.0.0.1:5501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else the SPA calls. Must be declared BEFORE the SPA fallback,
    # or /api/v1/* would be answered with index.html instead of being proxied.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:5501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ISS-091 (F13): an EXTERNAL uptime check needs a real answer.
    #
    # /health, /health/ready, /health/version and /metrics are mounted at the
    # Node APP ROOT, not under /api/v1, so before this they fell into the SPA
    # catch-all and returned index.html with a 200 — a monitor watching that URL
    # would report "up" for a dead API, which is worse than no monitor at all.
    #
    # Exact match on /health only: the liveness probe is safe to expose (it
    # reports nothing but that the process answers). /health/ready and
    # /health/version stay unproxied on purpose — `ready` reveals DB
    # reachability and `version` the running build.
    location = /health {
        proxy_pass http://127.0.0.1:5501/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        access_log off;
    }

    # /metrics is Prometheus scrape data — request paths, counts and timings for
    # the whole workspace. It was already unreachable, but only ACCIDENTALLY:
    # it fell through to the SPA catch-all and rendered index.html. That is
    # protection by coincidence, and the next person to add a location could
    # remove it without noticing. Deny it on purpose instead.
    location /metrics {
        deny all;
        access_log off;
    }

    # vite content-hashes these filenames, so a given URL never changes content.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or a deploy leaves browsers running the
    # previous bundle while the hashed assets it references are already gone.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # §29c Level 2 — the Web Push service worker and the manifest. NOT
    # content-hashed (the SW must live at a stable root URL to own the root
    # scope), so they need the same no-cache treatment as index.html: a cached
    # sw.js would keep an old push-payload contract alive on every device that
    # already registered it.
    location = /sw.js {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store, must-revalidate";
        types { } default_type application/manifest+json;
    }

    # SPA fallback. Without it, every deep link 404s on refresh - including the
    # PUBLIC /forms/:slug link that gets shared outside the company.
    #
    # It also catches the remaining app-root paths — /health/ready and
    # /health/version — so from the internet they resolve to index.html. They
    # stay reachable on localhost:5501 for monitoring. (/metrics no longer
    # relies on that: it has an explicit `deny all` above, and /health has an
    # explicit proxy, so neither depends on this fallback by accident — F13.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
